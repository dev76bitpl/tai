name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Server-side mirror of local .pre-commit-config.yaml — un-bypassable.
  # Branch protection rule should require this job to pass before merge.
  guards:
    name: Guards (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitlint needs full history to inspect PR commits

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      # File-level hooks (whitespace, secrets, etc.) across whole tree.
      - name: Run pre-commit hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          # Skip stack-aware lint/tests here — projects should add their own
          # native build/test job that runs after this one with full toolchain.
          # Skip no-commit-to-branch — CI runs on main but isn't creating commits;
          # the hook is for blocking local commits only.
          SKIP: guard-lint,guard-tests,no-commit-to-branch

      # Commit-msg hooks against each commit in the PR. Only format + language
      # enforcement here — guards that need staging context (tasks-staged,
      # tests-with-src, adr, user-tested) were enforced locally at commit time
      # and cannot be replayed in CI without re-staging historical state.
      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@example.com"
          git fetch origin ${{ github.base_ref }}
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg
            pre-commit run gitlint --hook-stage commit-msg --commit-msg-filename /tmp/commit-msg || exit 1
            pre-commit run guard-commit-lang --hook-stage commit-msg --commit-msg-filename /tmp/commit-msg || exit 1
          done

  # Project-specific checks — adapt to your stack (node/python/php/etc.).
  # Recommended: run independent checks as PARALLEL jobs so wall-clock ≈ the
  # slowest leg, not the sum. Trade-off: each job repeats setup → more runner
  # minutes. Rationale: docs/AI_TEMPLATE_NOTES.md → "CI — wydajność pipeline'u".
  #
  # checks:                            # test / lint / typecheck — same setup, different command
  #   runs-on: ubuntu-latest
  #   strategy:
  #     fail-fast: false               # one red leg shouldn't cancel the others' feedback
  #     matrix:
  #       task:
  #         - { name: test,      cmd: <test command> }
  #         - { name: lint,      cmd: <lint command> }
  #         - { name: typecheck, cmd: <typecheck command> }
  #   steps:
  #     - uses: actions/checkout@v4
  #     # - <setup toolchain + cache package manager + install deps>
  #     - run: ${{ matrix.task.cmd }}
  #
  # build:                             # own job — usually the longest; carries the build cache
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     # - <setup toolchain + install deps>
  #     # - cache the build tool's cache dir across runs (.next/cache, target/, build/, …)
  #     - run: <build command>
