name: CI

# Heavy, project-specific checks: tests of your stack, lint, typecheck, build, SAST.
# The guards (pre-commit, commit messages, secrets) are NOT here — they live in
# guards.yml and run on every PR.
#
# PULL REQUESTS ONLY — deliberately no `push: [main]` trigger; rationale in
# guards.yml and docs/AI_TEMPLATE_NOTES.md → "CI — wydajność pipeline'u".
#
# DOCS-ONLY PRs DO NOT START THIS WORKFLOW (`paths-ignore`). None of the jobs below
# reads documentation, so a two-paragraph docs fix would pay the full bill for
# nothing. A PR that touches at least one path outside the list runs everything.
#
# Two traps before you touch the list:
#   1. A path a job READS must not be ignored. Check what your tests, build and
#      linters actually load (test include globs, build inputs, content rendered
#      from Markdown) before adding a pattern. `.claude/**` is deliberately absent:
#      a project that tests its own hooks reads that directory.
#   2. A skipped workflow never reports a status. If a job from this file is a
#      REQUIRED check in branch protection, a docs-only PR waits for it forever.
#      With required checks, drop `paths-ignore` and let the job succeed early
#      for docs-only changes instead.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# Cancel superseded runs on the same branch/PR — rapid pushes during iteration
# no longer spawn parallel duplicate runs, which conserves Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A workflow file needs at least one job to be valid. This one never starts a
  # runner (`if: false` → skipped, not billed). DELETE it once the first real job
  # below is enabled.
  placeholder:
    name: No project checks enabled yet
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  # ── Project-specific checks — adapt to your stack (node/python/php/…) ─────────
  # Same setup, different final command → `strategy.matrix`, not copy-pasted jobs.
  # Parallel legs keep wall-clock at the slowest leg instead of the sum; the price
  # is a repeated setup and one rounded-up minute per leg. Price BOTH sides for
  # your project before choosing — if minutes are the binding constraint, these
  # legs become steps in the `checks` job of guards.yml and you wait longer on
  # every PR (and lose the docs-only skip, because guards.yml has no path filter).
  #
  # checks-stack:
  #   runs-on: ubuntu-latest
  #   strategy:
  #     fail-fast: false               # one red leg shouldn't cancel the others' feedback
  #     matrix:
  #       task:
  #         - { name: test,      cmd: <test command> }
  #         - { name: lint,      cmd: <lint command> }
  #         - { name: typecheck, cmd: <typecheck command> }
  #   steps:
  #     - uses: actions/checkout@v4
  #     # - <setup toolchain + cache package manager + install deps>
  #     - run: ${{ matrix.task.cmd }}
  #
  # build:                             # own job — usually the longest leg, so it belongs
  #   runs-on: ubuntu-latest           # BESIDE the matrix, not appended to it
  #   steps:
  #     - uses: actions/checkout@v4
  #     # - <setup toolchain + install deps>
  #     # Cache the BUILD tool's cache dir (.next/cache, target/, build/, .gradle/…):
  #     # `setup-*` caches only the package manager, so without it every build starts
  #     # from scratch. Gains show from the 2nd run on — the 1st populates the cache.
  #     # - uses: actions/cache@v4
  #     #   with:
  #     #     path: <build cache dir>
  #     #     key: build-${{ runner.os }}-${{ hashFiles('<lockfile>') }}-${{ hashFiles('<sources>') }}
  #     #     restore-keys: build-${{ runner.os }}-${{ hashFiles('<lockfile>') }}-
  #     - run: <build command>

  # ── SAST on your OWN code — the one check that always earns a separate job ───
  # BLOCKING (findings in code you wrote are always fixable). It gets its own job
  # only because it runs inside the tool's container image, which cannot host the
  # toolchain the `checks` job in guards.yml needs. Suppress a confirmed false
  # positive inline with a reason comment (audit trail, like a guard bypass) —
  # never loosen the rule.
  # Secret scanning is NOT here: gitleaks already covers it in guards.yml.
  #
  # sast:
  #   name: SAST
  #   runs-on: ubuntu-latest
  #   container:
  #     image: <sast tool image, e.g. semgrep/semgrep>
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: <scan command, failing the job on findings>
