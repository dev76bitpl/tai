name: CI

# PULL REQUESTS ONLY — deliberately no `push: [main]` trigger.
# Re-running the identical commit after merge repeats a result the PR already
# produced; measured on a real project it was HALF the Actions bill. Accepted
# risk: if `main` moves between a green PR and its merge, a semantic conflict
# lands unchecked — small for one maintainer, grows with parallel PRs.
# Rationale: docs/AI_TEMPLATE_NOTES.md → "CI — wydajność pipeline'u".
on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR — rapid pushes during iteration
# no longer spawn parallel duplicate runs, which conserves Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ONE job for everything that shares a checkout and a toolchain.
  #
  # Actions bills each JOB rounded UP to a full minute, so a 19-second job costs
  # a minute and five 45-second jobs cost five. Splitting also repeats checkout +
  # dependency install once per leg (~35 s each). Default to adding a STEP here
  # rather than a new job; give a job of its own only to something that cannot
  # share this environment (a scanner running inside its own container image).
  #
  # Trade-off accepted: steps run sequentially, so wall-clock is the sum and the
  # first failure stops the rest. Parallel legs buy faster feedback — worth it
  # only when minutes are plentiful (public repo, self-hosted runner).
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitlint needs full history to inspect PR commits

      # ── Guards: server-side mirror of .pre-commit-config.yaml, un-bypassable ──

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      # File-level hooks (whitespace, secrets, etc.) across whole tree.
      - name: Run pre-commit hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          # Skip stack-aware lint/tests here — the native steps below run them
          # with the full toolchain.
          # Skip no-commit-to-branch — CI isn't creating commits; the hook is for
          # blocking local commits only.
          SKIP: guard-lint,guard-tests,no-commit-to-branch

      # Commit-msg hooks against each commit in the PR. Only format + language
      # enforcement here — guards that need staging context (tasks-staged,
      # tests-with-src, adr, user-tested) were enforced locally at commit time
      # and cannot be replayed in CI without re-staging historical state.
      - name: Lint commit messages
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@example.com"
          git fetch origin ${{ github.base_ref }}
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg
            pre-commit run gitlint --hook-stage commit-msg --commit-msg-filename /tmp/commit-msg || exit 1
            pre-commit run guard-commit-lang --hook-stage commit-msg --commit-msg-filename /tmp/commit-msg || exit 1
          done

      # ── Project-specific checks — adapt to your stack (node/python/php/…) ────
      # Append them HERE as steps, cheapest-first, so one install serves them all
      # and you pay one rounded-up minute instead of one per check.
      #
      # - <setup toolchain + cache the package manager (~/.npm, ~/.cache/pip, …)>
      # - <install dependencies>
      # - run: <lint command>
      # - run: <typecheck command>
      # - run: <test command>
      #
      # Build last — it is the longest and only worth reaching if the rest passed.
      # Cache the BUILD tool's cache dir too (.next/cache, target/, build/, .gradle/…):
      # `setup-*` caches only the package manager, so without it every build starts
      # from scratch. Gains show from the 2nd run on — the 1st populates the cache.
      # - uses: actions/cache@v4
      #   with:
      #     path: <build cache dir>
      #     key: build-${{ runner.os }}-${{ hashFiles('<lockfile>') }}-${{ hashFiles('<sources>') }}
      #     restore-keys: build-${{ runner.os }}-${{ hashFiles('<lockfile>') }}-
      # - run: <build command>
      #
      # Dependency CVE scan — third-party holes in what you ship. REPORT-ONLY as a
      # step with `continue-on-error: true`: an unpatchable transitive CVE must not
      # wedge every merge. Trap + exit-code handling: docs/AI_TEMPLATE_NOTES.md →
      # "CI — skanery bezpieczeństwa".
      # - name: Dependency CVE scan
      #   continue-on-error: true
      #   run: |
      #     <scanner> <args> || code=$?
      #     if [ "${code:-0}" -gt 1 ]; then exit "${code}"; fi; exit 0

  # ── SAST on your OWN code — the one check that earns a separate job ──────────
  # BLOCKING (findings in code you wrote are always fixable). It gets its own job
  # only because it runs inside the tool's container image, which cannot host the
  # toolchain `checks` needs. Suppress a confirmed false positive inline with a
  # reason comment (audit trail, like a guard bypass) — never loosen the rule.
  # Secret scanning is NOT here: gitleaks already covers it in the guards above.
  #
  # sast:
  #   name: SAST
  #   runs-on: ubuntu-latest
  #   container:
  #     image: <sast tool image, e.g. semgrep/semgrep>
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: <scan command, failing the job on findings>
